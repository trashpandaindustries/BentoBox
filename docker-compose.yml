services:
  bentobox:
    container_name: BentoBox
    build:
      context: ./BentoBox
      args:
        CLIP_MODEL_ID: ${CLIP_MODEL_ID:-openai/clip-vit-base-patch32}
    restart: unless-stopped
    ports:
      - ${CLIP_PORT:-3000}:${CLIP_PORT:-3000}
    env_file:
      - .env
    volumes:
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://192.168.1.69:${CLIP_PORT:-3000}/healthz')"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 5
    networks:
      - processor_network

volumes:
  hf_cache:

networks:
  processor_network: 
